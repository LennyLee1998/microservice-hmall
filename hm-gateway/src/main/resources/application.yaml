server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    nacos:
      server-addr: 192.168.194.128:8848
    gateway:
      routes:
        - id: item-service
          uri:
            lb://item-service
          predicates:
            - Path=/items/**,/search/**
        - id: cart-service
          uri:
            lb://cart-service
          predicates:
            - Path=/carts/**
        - id: pay-service
          uri:
            lb://pay-service
          predicates:
            - Path=/pay-orders/**
        - id: trade-service
          uri:
            lb://trade-service
          predicates:
            - Path=/orders/**
        - id: user-service
          uri:
            lb://user-service
          predicates:
            - Path=/users/**,/addresses/**
      default-filters:
        - AddRequestHeader=truth, I will get everything I want
hm:
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: hmall123
    tokenTTL: 600m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi
